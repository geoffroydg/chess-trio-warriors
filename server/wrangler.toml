name = "chess-trio-warriors"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# Budget CPU d'un coup de bot (ms) : la limite de l'offre gratuite est ~10 ms par invocation.
BOT_CPU_MS = "8"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Obligatoire en offre gratuite : Durable Objects à stockage SQLite.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
