name: Audio

on:
  push:
    branches: [main, ccr-b4a21867-um8mut]
    paths:
      - 'scripts/audio/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ffmpeg
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libvorbis

      - name: Cache modèles (Piper, Hugging Face)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/piper-voices
          key: audio-models-v1

      - name: Dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install numpy piper-tts
          pip install torch --index-url https://download.pytorch.org/whl/cpu || true
          pip install transformers scipy || true

      - name: Effets sonores (numpy)
        run: python -I scripts/audio/gen_sfx.py

      - name: Voix (Piper)
        continue-on-error: true
        env:
          PIPER_VOICES: ~/piper-voices
        run: |
          export PIPER_VOICES="$HOME/piper-voices"
          python -I scripts/audio/gen_voice.py

      - name: Musique (MusicGen, repli procédural)
        continue-on-error: true
        env:
          MUSICGEN_TIMEOUT: '1200'
        run: python -I scripts/audio/gen_music.py

      - name: Commit des fichiers audio
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/assets/audio
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Audio généré par le pipeline (scripts/audio)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow :
      # on lance explicitement la construction de l'APK. audio.yml ne réagit
      # pas à app/assets/audio, donc aucune boucle.
      - name: Reconstruire l'APK
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run app.yml --ref "${GITHUB_REF_NAME}"
